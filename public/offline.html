<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sem Conexão — Legado e Futuro</title>
  <link rel="stylesheet" href="/desenvolvimento/assets/css/app.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body class="bg-[#03254A] text-slate-100 flex items-center justify-center min-h-screen p-4 text-center">
  <div class="max-w-md bg-white/10 backdrop-blur-md p-8 rounded-2xl border border-white/20 shadow-2xl">
    <div
      class="w-16 h-16 mx-auto mb-4 rounded-full bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 text-2xl">
      <i class="fa-solid fa-wifi"></i>
    </div>
    <h1 class="text-2xl font-bold font-serif mb-2">Sem Conexão com a Internet</h1>
    <p class="text-sm text-slate-300 mb-6">
      Você está no modo offline. A reprodução de novos vídeos e a sincronização do progresso dependem de conexão ativa
      com a internet.
    </p>
    <button onclick="window.location.reload()"
      class="px-6 py-2.5 bg-amber-500 hover:bg-amber-600 text-slate-900 font-bold rounded-lg shadow-lg transition-transform active:scale-95">
      <i class="fa-solid fa-rotate-right mr-2"></i>Tentar Novamente
    </button>
  </div>
</body>

</html>
